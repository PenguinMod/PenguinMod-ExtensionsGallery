<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#071026" />
      <stop offset="100%" stop-color="#030611" />
    </linearGradient>

    <!-- Shield & Primary Accent Gradient -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#0056B3" />
    </linearGradient>

    <!-- Cyan Glow Accent -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16223b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0d1527" stop-opacity="0.7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Ambient Glow -->
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16" />

  <!-- Ambient Glow Orbs -->
  <circle cx="250" cy="200" r="180" fill="#0A84FF" opacity="0.15" filter="url(#ambientGlow)" />
  <circle cx="950" cy="100" r="150" fill="#00F2FE" opacity="0.1" filter="url(#ambientGlow)" />

  <!-- Abstract Tech Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Left Side Graphic: Security Shield & Lock Badge -->
  <g transform="translate(180, 200)">
    <!-- Outer Glowing Ring -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#cyanGlow)" stroke-width="2" opacity="0.4" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="95" fill="none" stroke="#0A84FF" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />

    <!-- Shield Base -->
    <path d="M 0 -70 L 55 -40 V 10 C 55 50 0 75 0 75 C 0 75 -55 50 -55 10 V -40 Z" fill="url(#primaryGlow)" filter="url(#neonGlow)" />
    <path d="M 0 -62 L 48 -35 V 8 C 48 43 0 65 0 65 C 0 65 -48 43 -48 8 V -35 Z" fill="#081329" opacity="0.9" />

    <!-- Lock Icon inside Shield -->
    <rect x="-16" y="-5" width="32" height="26" rx="5" fill="url(#cyanGlow)" />
    <path d="M -10 -5 V -14 C -10 -21 10 -21 10 -14 V -5" fill="none" stroke="url(#cyanGlow)" stroke-width="4" stroke-linecap="round" />
    <circle cx="0" cy="6" r="3" fill="#081329" />
    <path d="M 0 9 V 14" stroke="#081329" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Center/Right Typography & Info -->
  <!-- Main Title -->
  <text x="360" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="64" fill="#ffffff" letter-spacing="1">
    REOS <tspan fill="url(#cyanGlow)">AUTH</tspan>
  </text>

  <!-- Subtitle -->
  <text x="365" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="20" fill="#8E9BAE" letter-spacing="0.5">
    Secure OAuth Authentication for PenguinMod
  </text>

  <!-- Feature Badges/Tags -->
  <!-- Badge 1: Dynamic User Sync -->
  <g transform="translate(365, 255)">
    <rect width="160" height="34" rx="17" fill="url(#cardBg)" stroke="#0A84FF" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="18" cy="17" r="4" fill="#00F2FE" />
    <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#D1E4FF">
      Dynamic User Sync
    </text>
  </g>

  <!-- Badge 2: Zero CORS Block -->
  <g transform="translate(540, 255)">
    <rect width="145" height="34" rx="17" fill="url(#cardBg)" stroke="#0A84FF" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="18" cy="17" r="4" fill="#30D158" />
    <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#D1E4FF">
      CORS Immune
    </text>
  </g>

  <!-- Badge 3: Unsandboxed -->
  <g transform="translate(700, 255)">
    <rect width="130" height="34" rx="17" fill="url(#cardBg)" stroke="#0A84FF" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="18" cy="17" r="4" fill="#FF9F0A" />
    <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#D1E4FF">
      Unsandboxed
    </text>
  </g>

  <!-- Corner Decorative Accent -->
  <path d="M 1150 40 L 1160 40 L 1160 50" stroke="url(#cyanGlow)" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 50 360 L 40 360 L 40 350" stroke="#0A84FF" stroke-width="3" fill="none" stroke-linecap="round" />
</svg>
